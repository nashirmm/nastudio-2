    <!-- Instant Dark Mode Initializer (Default is Light Mode) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nastudio-theme');
          // Only enable dark if the user explicitly chose and saved 'dark'
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
